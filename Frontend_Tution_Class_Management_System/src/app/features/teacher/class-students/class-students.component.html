<app-class-header [classId]="classId" [schoolClass]="schoolClass"></app-class-header>

<div class="card table-card">
  <div class="table-toolbar">
    <div class="search-box">
      <div class="input-icon">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Search students or parents…" [(ngModel)]="filter" aria-label="Search roster" />
      </div>
    </div>
    <span class="small text-muted" *ngIf="!loading">{{ students.length }} student{{ students.length === 1 ? '' : 's' }}</span>
  </div>

  <app-skeleton-list *ngIf="loading"></app-skeleton-list>

  <app-empty-state *ngIf="!loading && loadError" icon="wifi-off" tone="danger" title="Couldn't load the roster" message="Check your connection and try again.">
    <button type="button" class="btn btn-white" (click)="load()"><i class="bi bi-arrow-clockwise"></i> Retry</button>
  </app-empty-state>

  <app-empty-state *ngIf="!loading && !loadError && students.length === 0" icon="people"
                   title="No students enrolled yet" message="The institute enrols students into classes. Check back later."></app-empty-state>

  <div class="table-responsive" *ngIf="!loading && !loadError && students.length > 0">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th style="width: 3rem">#</th>
          <th>Student</th>
          <th class="d-none d-sm-table-cell">Grade</th>
          <th class="d-none d-md-table-cell">Parent</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of filtered; let i = index">
          <td class="text-muted tabular-nums">{{ i + 1 }}</td>
          <td>
            <div class="entity">
              <app-avatar [name]="student.fullName"></app-avatar>
              <div class="min-w-0">
                <div class="entity-name">{{ student.fullName }}</div>
                <div class="entity-meta d-md-none">Parent: {{ student.parentName }}</div>
              </div>
            </div>
          </td>
          <td class="d-none d-sm-table-cell"><span class="badge-soft tone-neutral">{{ student.gradeLevel }}</span></td>
          <td class="d-none d-md-table-cell">{{ student.parentName }}</td>
        </tr>
        <tr *ngIf="filtered.length === 0"><td colspan="4" class="text-center text-muted py-4">No one matches "{{ filter }}".</td></tr>
      </tbody>
    </table>
  </div>
</div>
