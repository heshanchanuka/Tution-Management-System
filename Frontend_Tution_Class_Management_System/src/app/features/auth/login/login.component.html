<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card shadow-sm border-0 p-4" style="width: 380px;">
    <div class="text-center mb-4">
      <h4 class="fw-bold mb-1">Sign in</h4>
      <p class="text-muted small mb-0">Tuition Class Management System</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          formControlName="username"
          class="form-control"
          [class.is-invalid]="f['username'].invalid && f['username'].touched"
          placeholder="admin"
        />
        <div class="invalid-feedback" *ngIf="f['username'].invalid && f['username'].touched">
          Username is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••"
        />
        <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>

      <p class="small text-center mt-3 mb-0">
        Don't have an account? <a routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
