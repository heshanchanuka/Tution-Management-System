<div class="container-fluid px-4 py-4" style="max-width: 560px;">
  <h3 class="fw-bold mb-4">{{ isEditMode ? 'Edit Teacher' : 'Add Teacher' }}</h3>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row" *ngIf="!isEditMode">
      <div class="col-md-6 mb-3">
        <label class="form-label">Username</label>
        <input type="text" formControlName="username" class="form-control"
               [class.is-invalid]="f['username'].invalid && f['username'].touched" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Initial Password</label>
        <input type="text" formControlName="password" class="form-control"
               [class.is-invalid]="f['password'].invalid && f['password'].touched" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" formControlName="fullName" class="form-control"
             [class.is-invalid]="f['fullName'].invalid && f['fullName'].touched" />
      <div class="invalid-feedback" *ngIf="f['fullName'].invalid && f['fullName'].touched">
        Full name is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" formControlName="phone" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Subject Specialty</label>
      <input type="text" formControlName="subjectSpecialty" class="form-control" placeholder="e.g. Mathematics" />
    </div>

    <div class="mb-4">
      <label class="form-label">Qualifications</label>
      <input type="text" formControlName="qualifications" class="form-control" placeholder="e.g. BSc in Mathematics" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ isEditMode ? 'Save Changes' : 'Create Teacher' }}
    </button>
    <a routerLink="/admin/teachers" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>
