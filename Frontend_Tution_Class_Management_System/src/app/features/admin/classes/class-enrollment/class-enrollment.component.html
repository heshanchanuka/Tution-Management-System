<div class="container-fluid px-4 py-4" style="max-width: 640px;">
  <a routerLink="/admin/classes" class="text-decoration-none small">‹ Back to Classes</a>

  <div class="d-flex justify-content-between align-items-baseline mt-2 mb-4">
    <h3 class="fw-bold mb-0" *ngIf="schoolClass">{{ schoolClass.subject }} — {{ schoolClass.gradeLevel }}</h3>
    <span class="badge bg-secondary" *ngIf="schoolClass">{{ enrolled.length }} / {{ schoolClass.capacity }}</span>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <h6 class="fw-semibold mb-3">Enroll a student</h6>
      <div class="input-group">
        <select class="form-select" [(ngModel)]="selectedStudentId">
          <option [ngValue]="null" disabled>Select a student…</option>
          <option *ngFor="let student of unenrolledStudents" [ngValue]="student.id">
            {{ student.fullName }} ({{ student.gradeLevel }})
          </option>
        </select>
        <button type="button" class="btn btn-primary" [disabled]="!selectedStudentId" (click)="enroll()">Enroll</button>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Full Name</th>
            <th>Grade</th>
            <th>Parent</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of enrolled">
            <td>{{ student.fullName }}</td>
            <td>{{ student.gradeLevel }}</td>
            <td>{{ student.parentName }}</td>
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="unenroll(student)">Remove</button>
            </td>
          </tr>
          <tr *ngIf="enrolled.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No students enrolled yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
