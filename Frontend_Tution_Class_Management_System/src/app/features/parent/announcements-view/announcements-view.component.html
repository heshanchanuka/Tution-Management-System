<div class="container-fluid px-4 py-4" style="max-width: 680px;">
  <h3 class="fw-bold mb-4">Announcements</h3>

  <div class="card border-0 shadow-sm mb-3" *ngFor="let announcement of announcements">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 class="fw-semibold mb-0">{{ announcement.title }}</h5>
        <span class="badge bg-secondary" *ngIf="!announcement.targetClassId">Everyone</span>
        <span class="badge bg-info" *ngIf="announcement.targetClassId">{{ announcement.targetClassSubject }}</span>
      </div>
      <p class="mb-2">{{ announcement.message }}</p>
      <p class="text-muted small mb-0">
        Posted by {{ announcement.postedByName }} · {{ announcement.postedAt | date:'medium' }}
      </p>
    </div>
  </div>

  <div class="alert alert-info" *ngIf="!loading && announcements.length === 0">
    No announcements right now.
  </div>
</div>
