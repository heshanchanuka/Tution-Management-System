<app-page-header title="My children" subtitle="Students linked to your account."></app-page-header>

<div class="row g-3" *ngIf="loading">
  <div class="col-md-6 col-xl-4" *ngFor="let i of [1, 2]">
    <div class="item-card"><span class="skeleton mb-3" style="height: 3.75rem; width: 3.75rem; border-radius: 50%"></span><span class="skeleton" style="height: 1rem; width: 50%"></span></div>
  </div>
</div>

<div class="card" *ngIf="!loading && children.length === 0">
  <app-empty-state icon="person-plus" title="No children linked yet"
                   message="The institute links your children to your account when they're registered. Contact the office if this looks wrong."></app-empty-state>
</div>

<div class="row g-3" *ngIf="!loading && children.length > 0">
  <div class="col-md-6 col-xl-4" *ngFor="let child of children">
    <div class="item-card text-center">
      <app-avatar class="d-block mb-3" [name]="child.fullName" size="xl"></app-avatar>
      <h3 class="h6 fw-bold mb-1">{{ child.fullName }}</h3>
      <div class="text-muted small mb-1">{{ child.gradeLevel }}</div>
      <div class="text-muted small" *ngIf="child.dateOfBirth">Born {{ child.dateOfBirth | date:'d MMMM y' }}</div>
      <div class="item-card-footer justify-content-center">
        <a [routerLink]="[child.id, 'attendance']" class="btn btn-sm btn-soft-success"><i class="bi bi-calendar2-check"></i> Attendance</a>
        <a [routerLink]="[child.id, 'results']" class="btn btn-sm btn-soft-primary"><i class="bi bi-mortarboard"></i> Results</a>
        <a [routerLink]="[child.id, 'fees']" class="btn btn-sm btn-soft-warning"><i class="bi bi-wallet2"></i> Fees</a>
      </div>
    </div>
  </div>
</div>
