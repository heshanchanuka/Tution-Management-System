<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/home">Tuition Class Management</a>

    <div class="collapse navbar-collapse d-flex justify-content-between">
      <ul class="navbar-nav me-auto" *ngIf="authService.currentUser$ | async as user">
        <li class="nav-item" *ngIf="user.roles.includes('ADMIN')">
          <a class="nav-link" routerLink="/admin/dashboard">Admin Dashboard</a>
        </li>
        <li class="nav-item" *ngIf="user.roles.includes('TEACHER')">
          <a class="nav-link" routerLink="/teacher/dashboard">Teacher Dashboard</a>
        </li>
        <li class="nav-item" *ngIf="user.roles.includes('PARENT')">
          <a class="nav-link" routerLink="/parent/dashboard">Parent Dashboard</a>
        </li>
      </ul>

      <ul class="navbar-nav align-items-lg-center">
        <ng-container *ngIf="authService.currentUser$ | async as user; else loggedOut">
          <li class="nav-item text-light small me-3">
            {{ user.fullName }}
            <span class="badge bg-secondary">{{ user.roles.join(', ') }}</span>
          </li>
          <li class="nav-item">
            <button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
          </li>
        </ng-container>
        <ng-template #loggedOut>
          <li class="nav-item">
            <a class="btn btn-success btn-sm" routerLink="/login">Login</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>
